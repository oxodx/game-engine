import org.gradle.internal.os.OperatingSystem

plugins {
  id 'java'
}

group = 'nl.oxod.gameengine'
version = '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

project.ext.lwjglVersion = "3.4.3"
project.ext.jomlVersion = "1.10.9"
project.ext.imguiVersion = "1.92.7.1"
project.ext.lombokVersion = "1.18.48"

switch (OperatingSystem.current()) {
  case OperatingSystem.LINUX:
    project.ext.lwjglNatives = "natives-linux"
    def osArch = System.getProperty("os.arch")
    if (osArch.startsWith("arm") || osArch.startsWith("aarch64")) {
      project.ext.lwjglNatives += osArch.contains("64") || osArch.startsWith("armv8") ? "-arm64" : "-arm32"
    } else if (osArch.startsWith("ppc")) {
      project.ext.lwjglNatives += "-ppc64le"
    } else if (osArch.startsWith("riscv")) {
      project.ext.lwjglNatives += "-riscv64"
    }
    break
  case OperatingSystem.WINDOWS:
    project.ext.lwjglNatives = "natives-windows"
    break
}

dependencies {
  compileOnly("org.projectlombok:lombok:$lombokVersion")
  annotationProcessor("org.projectlombok:lombok:$lombokVersion")

  testCompileOnly("org.projectlombok:lombok:$lombokVersion")
  testAnnotationProcessor("org.projectlombok:lombok:$lombokVersion")

  implementation "io.github.spair:imgui-java-binding:$imguiVersion"
  implementation "io.github.spair:imgui-java-lwjgl3:$imguiVersion"
  implementation "io.github.spair:imgui-java-$lwjglNatives:$imguiVersion"

  implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

  implementation "org.lwjgl:lwjgl"
  implementation "org.lwjgl:lwjgl-assimp"
  implementation "org.lwjgl:lwjgl-glfw"
  implementation "org.lwjgl:lwjgl-nfd"
  implementation "org.lwjgl:lwjgl-openal"
  implementation "org.lwjgl:lwjgl-opengl"
  implementation "org.lwjgl:lwjgl-stb"
  implementation "org.lwjgl:lwjgl::$lwjglNatives"
  implementation "org.lwjgl:lwjgl-assimp::$lwjglNatives"
  implementation "org.lwjgl:lwjgl-glfw::$lwjglNatives"
  implementation "org.lwjgl:lwjgl-nfd::$lwjglNatives"
  implementation "org.lwjgl:lwjgl-openal::$lwjglNatives"
  implementation "org.lwjgl:lwjgl-opengl::$lwjglNatives"
  implementation "org.lwjgl:lwjgl-stb::$lwjglNatives"
  implementation "org.joml:joml:${jomlVersion}"

  testImplementation platform('org.junit:junit-bom:6.0.0')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}
